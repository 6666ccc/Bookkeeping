# Example for an existing Linux Nginx installation.
# Replace the hostname and root with your real domain and site directory.
# This HTTP block is for initial verification. Enable HTTPS on the same site
# (or terminate TLS at an existing reverse proxy) before using PWA features.
# Keep the normal "include mime.types;" in the parent http {} configuration.
server {
    listen 80;
    server_name bookkeeping.example.com;

    root /var/www/bookkeeping;
    index index.html;

    # The entry page and service worker must check for newer releases.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite places content-hashed JS and CSS in assets/.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Missing static files must return 404, not the application HTML.
    location ~* \.(?:js|css|png|svg|ico|json|webmanifest|woff2?)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
